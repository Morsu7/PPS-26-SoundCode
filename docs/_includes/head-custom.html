<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1117">

<style>
    :root {
        color-scheme: dark;
        --background: #0d1117;
        --surface: #161b22;
        --border: #30363d;
        --text: #c9d1d9;
        --heading: #f0f6fc;
        --muted: #8b949e;
        --accent: #58a6ff;
        --accent-hover: #79c0ff;
    }

    body {
        background-color: var(--background);
        color: var(--text);
    }

    .page-header {
        padding: 1.25rem 1rem;
        background-color: #111827;
        background-image: linear-gradient(120deg, #111827, #1e3a5f);
    }

    .page-header .project-name {
        margin: 0;
        font-size: 2rem;
    }

    .page-header .project-tagline,
    .page-header .btn {
        display: none;
    }

    .chapter-menu {
        position: fixed;
        top: 0.75rem;
        left: 0.75rem;
        z-index: 999;
        width: 14.5rem;
        max-height: calc(100vh - 1.5rem);
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 0.375rem;
        background-color: rgb(13 17 23 / 92%);
        color: var(--text);
        font-size: 0.875rem;
        backdrop-filter: blur(0.5rem);
    }

    .chapter-menu summary {
        padding: 0.65rem 0.75rem;
        color: var(--heading);
        font-weight: 600;
        cursor: pointer;
    }

    .chapter-menu ul {
        margin: 0;
        padding: 0 0.75rem 0.75rem;
        list-style: none;
    }

    .chapter-menu li {
        padding: 0.25rem 0;
    }

    .chapter-menu a {
        color: var(--text);
        text-decoration: none;
    }

    .chapter-menu a:hover {
        color: var(--accent-hover);
        text-decoration: underline;
    }

    .chapter-menu a[aria-current="page"] {
        color: var(--accent);
        font-weight: 600;
    }

    .site-footer-owner {
        display: none;
    }

    .main-content {
        color: var(--text);
    }

    .main-content h1,
    .main-content h2,
    .main-content h3,
    .main-content h4,
    .main-content h5,
    .main-content h6 {
        color: var(--heading);
    }

    .main-content a {
        color: var(--accent);
    }

    .main-content a:hover {
        color: var(--accent-hover);
    }

    .main-content code {
        background-color: var(--surface);
        color: #ff7b72;
    }

    .main-content pre {
        background-color: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
    }

    .main-content pre code {
        background-color: transparent;
        color: inherit;
    }

    .highlight { color: #c9d1d9; }
    .highlight .c, .highlight .cm, .highlight .cp, .highlight .c1, .highlight .cs { color: #8b949e; font-style: italic; } /* Commenti */
    .highlight .k, .highlight .kd, .highlight .kn, .highlight .kp, .highlight .kr, .highlight .kt, .highlight .kv { color: #ff7b72; } /* Parole chiave (def, private, ecc) */
    .highlight .n, .highlight .nx, .highlight .vx, .highlight .vi, .highlight .vd { color: #c9d1d9; } /* Variabili e nomi */
    .highlight .nc, .highlight .nf, .highlight .fm { color: #d2a8ff; } /* Classi e Funzioni (es. ws, Unit) */
    .highlight .s, .highlight .sb, .highlight .sc, .highlight .dl, .highlight .sd, .highlight .s2, .highlight .se, .highlight .sh, .highlight .si, .highlight .sx, .highlight .sr, .highlight .s1, .highlight .ss { color: #a5d6ff; } /* Stringhe */
    .highlight .m, .highlight .mb, .highlight .mf, .highlight .mh, .highlight .mi, .highlight .il, .highlight .mo { color: #79c0ff; } /* Numeri (es. 0) */
    .highlight .o, .highlight .p, .highlight .pi { color: #c9d1d9; } /* Operatori e punteggiatura */
    .highlight .err { color: #f85149; background-color: #490202; }

    .main-content blockquote {
        border-left-color: var(--border);
        color: var(--muted);
    }

    .main-content table th,
    .main-content table td {
        border-color: var(--border);
    }

    .main-content table tr {
        background-color: var(--background);
        border-top-color: var(--border);
    }

    .main-content table tr:nth-child(2n) {
        background-color: var(--surface);
    }

    .main-content hr {
        background-color: var(--border);
        border-color: var(--border);
    }

    .site-footer {
        border-top-color: var(--border);
        color: var(--muted);
    }

    .site-footer-credits {
        color: var(--muted);
    }

    .btn {
        color: var(--heading);
        background-color: rgb(240 246 252 / 8%);
        border-color: rgb(240 246 252 / 25%);
    }

    .btn:hover {
        color: #ffffff;
        background-color: rgb(240 246 252 / 16%);
        border-color: rgb(240 246 252 / 40%);
    }

    .mermaid {
        overflow-x: auto;
        padding: 1rem;
        border: 1px solid var(--border);
        border-radius: 0.375rem;
        background-color: var(--surface);
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const chapterMenu = document.createElement("details");
        chapterMenu.className = "chapter-menu";
        chapterMenu.open = window.matchMedia("(min-width: 80rem)").matches;
        chapterMenu.innerHTML = `
            <summary>Capitoli</summary>
            <ul>
                <li><a href="{{ '/' | relative_url }}">Indice</a></li>
                <li><a href="{{ '/01-introduzione.html' | relative_url }}">Introduzione</a></li>
                <li><a href="{{ '/02-processo-di-sviluppo.html' | relative_url }}">Processo di sviluppo</a></li>
                <li><a href="{{ '/03-requisiti-e-analisi.html' | relative_url }}">Requisiti e analisi</a></li>
                <li><a href="{{ '/04-architettura.html' | relative_url }}">Architettura</a></li>
                <li><a href="{{ '/05-design-di-dettaglio.html' | relative_url }}">Design di dettaglio</a></li>
                <li><a href="{{ '/06-implementazione.html' | relative_url }}">Implementazione</a></li>
                <li><a href="{{ '/07-verifica-e-validazione.html' | relative_url }}">Verifica e validazione</a></li>
                <li><a href="{{ '/08-retrospettiva.html' | relative_url }}">Retrospettiva</a></li>
            </ul>
        `;

        chapterMenu.querySelectorAll("a").forEach((link) => {
            if (new URL(link.href).pathname === window.location.pathname) {
                link.setAttribute("aria-current", "page");
            }
        });

        const placeMenuBelowHeader = () => {
            const header = document.querySelector(".page-header");
            const headerBottom = header ? header.getBoundingClientRect().bottom : 0;
            const top = Math.max(12, headerBottom + 12);

            chapterMenu.style.top = `${top}px`;
            chapterMenu.style.maxHeight = `calc(100vh - ${top + 12}px)`;
        };

        document.body.prepend(chapterMenu);
        placeMenuBelowHeader();
        window.addEventListener("resize", placeMenuBelowHeader);
    });
</script>

<script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

    document.addEventListener("DOMContentLoaded", async () => {
        document.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
            const container = document.createElement("div");
            container.className = "mermaid";
            container.textContent = code.textContent;
            code.parentElement.replaceWith(container);
        });

        mermaid.initialize({
            startOnLoad: false,
            theme: "dark"
        });

        await mermaid.run({
            querySelector: ".mermaid"
        });
    });
</script>
